<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle of Fifths Explorer</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    max-width:1000px;
    margin:20px auto;
    padding:20px;
    text-align:center;
}

h1{
    color:#2c3e50;
}

.circle{
    position:relative;
    width:550px;
    height:550px;
    margin:30px auto;
}

.key{
    position:absolute;
    width:70px;
    height:70px;
    border-radius:50%;
    border:none;
    background:#dbeafe;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.key:hover{
    transform:scale(1.1);
}

.active{
    background:#3b82f6;
    color:white;
}

.info{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
    margin-top:20px;
}

.arrow{
    font-size:1.2em;
    margin-top:10px;
}

button{
    padding:10px 16px;
    margin:5px;
    cursor:pointer;
}

</style>
</head>
<body>

<h1>Circle of Fifths Explorer</h1>

<p>
Click a key to explore its key signature and relative minor.
</p>

<div class="circle" id="circle"></div>

<div class="info">

<h2 id="keyName">
C Major
</h2>

<p id="signature">
0 sharps or flats
</p>

<p id="relative">
Relative Minor: A Minor
</p>

<div class="arrow">
Clockwise = Add Sharps →
<br><br>
← Counterclockwise = Add Flats
</div>

<button onclick="playTonic()">
Play Tonic
</button>

</div>

<script>

const AudioContext =
window.AudioContext ||
window.webkitAudioContext;

const audioCtx =
new AudioContext();

const keys = [

{
name:"C",
relative:"A Minor",
signature:"0 sharps or flats",
freq:261.63
},

{
name:"G",
relative:"E Minor",
signature:"1 sharp",
freq:392.00
},

{
name:"D",
relative:"B Minor",
signature:"2 sharps",
freq:293.66
},

{
name:"A",
relative:"F♯ Minor",
signature:"3 sharps",
freq:440.00
},

{
name:"E",
relative:"C♯ Minor",
signature:"4 sharps",
freq:329.63
},

{
name:"B",
relative:"G♯ Minor",
signature:"5 sharps",
freq:493.88
},

{
name:"F♯",
relative:"D♯ Minor",
signature:"6 sharps",
freq:369.99
},

{
name:"D♭",
relative:"B♭ Minor",
signature:"5 flats",
freq:277.18
},

{
name:"A♭",
relative:"F Minor",
signature:"4 flats",
freq:415.30
},

{
name:"E♭",
relative:"C Minor",
signature:"3 flats",
freq:311.13
},

{
name:"B♭",
relative:"G Minor",
signature:"2 flats",
freq:466.16
},

{
name:"F",
relative:"D Minor",
signature:"1 flat",
freq:349.23
}

];

let currentKey = keys[0];

function buildCircle(){

    const circle =
    document.getElementById(
        "circle"
    );

    const radius = 220;

    const center = 275;

    keys.forEach((key,index)=>{

        const angle =
        (index/12) *
        (Math.PI*2);

        const x =
        center +
        Math.cos(
            angle - Math.PI/2
        ) * radius;

        const y =
        center +
        Math.sin(
            angle - Math.PI/2
        ) * radius;

        const btn =
        document.createElement(
            "button"
        );

        btn.className =
        "key";

        btn.textContent =
        key.name;

        btn.style.left =
        (x-35)+"px";

        btn.style.top =
        (y-35)+"px";

        btn.onclick =
        ()=>selectKey(
            key,
            btn
        );

        circle.appendChild(
            btn
        );

        if(index===0){
            btn.classList.add(
                "active"
            );
        }

    });
}

function selectKey(key,button){

    document
    .querySelectorAll(".key")
    .forEach(k=>
        k.classList.remove(
            "active"
        )
    );

    button.classList.add(
        "active"
    );

    currentKey = key;

    document
    .getElementById(
        "keyName"
    )
    .textContent =
    key.name +
    " Major";

    document
    .getElementById(
        "signature"
    )
    .textContent =
    key.signature;

    document
    .getElementById(
        "relative"
    )
    .textContent =
    "Relative Minor: " +
    key.relative;
}

async function playTonic(){

    await audioCtx.resume();

    const osc =
    audioCtx.createOscillator();

    const gain =
    audioCtx.createGain();

    osc.frequency.value =
    currentKey.freq;

    gain.gain.value =
    .2;

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.start();

    osc.stop(
        audioCtx.currentTime + 1
    );
}

buildCircle();

</script>

</body>
</html>
