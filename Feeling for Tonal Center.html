<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feeling for Tonal Center</title>

<style>
body{
    font-family:Arial, sans-serif;
    max-width:900px;
    margin:30px auto;
    text-align:center;
    background:#f5f7fa;
}

h1{
    color:#2c3e50;
}

#exerciseType{
    font-size:1.2em;
    font-weight:bold;
    margin:20px;
}

button{
    padding:12px 18px;
    margin:6px;
    font-size:16px;
    cursor:pointer;
}

#feedback{
    min-height:40px;
    margin-top:20px;
    font-size:1.2em;
    font-weight:bold;
}

#score{
    margin-top:20px;
    font-size:1.1em;
}
</style>
</head>
<body>

<h1>Feeling for Tonal Center</h1>

<p>
Listen carefully and identify the key tone (tonic).
</p>

<div id="exerciseType">
Press "New Exercise"
</div>

<button id="playBtn">New Exercise</button>

<div>
    <button class="answer" data-answer="1">1st Note</button>
    <button class="answer" data-answer="2">2nd Note</button>
    <button class="answer" data-answer="3">3rd Note</button>
</div>

<div id="feedback"></div>

<div id="score">
Correct: <span id="correct">0</span> |
Total: <span id="total">0</span>
</div>

<script>

const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

let correctAnswer = null;
let total = 0;
let correct = 0;

function midiToFreq(midi){
    return 440 * Math.pow(2,(midi - 69)/12);
}

function randomChoice(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

function playTone(freq,start,duration,volume=0.18){

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "triangle";
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0.0001,start);
    gain.gain.exponentialRampToValueAtTime(volume,start+0.02);
    gain.gain.setValueAtTime(volume,start+duration-0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001,start+duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(start);
    osc.stop(start+duration);
}

function playChord(notes,start,duration){

    notes.forEach(note=>{
        playTone(
            midiToFreq(note),
            start,
            duration,
            0.12
        );
    });
}

function majorChord(root){
    return [root, root+4, root+7];
}

function minorChord(root){
    return [root, root+3, root+7];
}

function dominantChord(root){
    return [root+7, root+11, root+14];
}

function buildScale(root,mode){

    if(mode==="major"){
        return [0,2,4,5,7,9,11,12]
            .map(x=>root+x);
    }

    return [0,2,3,5,7,8,10,12]
        .map(x=>root+x);
}

function setExerciseLabel(text){
    document.getElementById("exerciseType")
        .textContent = text;
}

async function newExercise(){

    await audioCtx.resume();

    document.getElementById("feedback")
        .textContent = "";

    if(Math.random() < 0.5){
        chordExercise();
    }
    else{
        phraseExercise();
    }
}

function chordExercise(){

    setExerciseLabel(
        "Chord Exercise: Which note is the key tone?"
    );

    const keys = [
        {tonic:60, mode:"major"},
        {tonic:62, mode:"major"},
        {tonic:65, mode:"major"},
        {tonic:67, mode:"major"},
        {tonic:69, mode:"minor"},
        {tonic:64, mode:"minor"}
    ];

    const key = randomChoice(keys);

    const tonic = key.tonic;

    const candidates = [
        tonic,
        tonic + 7,
        tonic + (key.mode==="major" ? 4 : 3)
    ];

    shuffle(candidates);

    correctAnswer =
        candidates.indexOf(tonic) + 1;

    const start =
        audioCtx.currentTime + 0.25;

    if(key.mode==="major"){

        playChord(
            majorChord(tonic),
            start,
            1.0
        );

        playChord(
            majorChord(tonic+5),
            start+1.3,
            1.0
        );

        playChord(
            dominantChord(tonic),
            start+2.6,
            1.0
        );

        playChord(
            majorChord(tonic),
            start+3.9,
            1.0
        );
    }
    else{

        playChord(
            minorChord(tonic),
            start,
            1.0
        );

        playChord(
            minorChord(tonic+5),
            start+1.3,
            1.0
        );

        playChord(
            dominantChord(tonic),
            start+2.6,
            1.0
        );

        playChord(
            minorChord(tonic),
            start+3.9,
            1.0
        );
    }

    candidates.forEach((note,index)=>{

        playTone(
            midiToFreq(note),
            start+5.8+(index*1.0),
            0.8
        );

    });
}

function phraseExercise(){

    setExerciseLabel(
        "Phrase Exercise: Which note is the key tone?"
    );

    const keys = [
        {tonic:60, mode:"major"},
        {tonic:62, mode:"major"},
        {tonic:65, mode:"major"},
        {tonic:67, mode:"major"},
        {tonic:69, mode:"minor"},
        {tonic:64, mode:"minor"}
    ];

    const key = randomChoice(keys);

    const tonic = key.tonic;

    const scale =
        buildScale(tonic,key.mode);

    let melody = [];

    const patterns = [

        [0,1,2,4,5,4,2,1],
        [4,5,4,2,1,6,0,1],
        [0,2,4,5,4,2,1,0],
        [4,2,1,6,4,2,1,0]
    ];

    const pattern =
        randomChoice(patterns);

    pattern.forEach(degree=>{

        melody.push(scale[degree]);

    });

    const candidates = [
        tonic,
        tonic + 7,
        tonic + (key.mode==="major" ? 4 : 3)
    ];

    shuffle(candidates);

    correctAnswer =
        candidates.indexOf(tonic) + 1;

    const start =
        audioCtx.currentTime + 0.25;

    melody.forEach((note,index)=>{

        playTone(
            midiToFreq(note),
            start + (index*0.55),
            0.45,
            0.16
        );

    });

    const candidateStart =
        start + melody.length*0.55 + 0.8;

    candidates.forEach((note,index)=>{

        playTone(
            midiToFreq(note),
            candidateStart + index*1.0,
            0.8
        );

    });
}

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );

        [array[i],array[j]] =
            [array[j],array[i]];
    }
}

function checkAnswer(choice){

    if(correctAnswer===null){

        document.getElementById("feedback")
            .textContent =
            "Play an exercise first.";

        return;
    }

    total++;

    if(choice===correctAnswer){

        correct++;

        document.getElementById("feedback")
            .textContent =
            "✓ Correct!";

        document.getElementById("feedback")
            .style.color =
            "green";
    }
    else{

        const label =
            correctAnswer === 1
            ? "1st"
            : correctAnswer === 2
            ? "2nd"
            : "3rd";

        document.getElementById("feedback")
            .textContent =
            "✗ Incorrect. The key tone was the " +
            label + " note.";

        document.getElementById("feedback")
            .style.color =
            "crimson";
    }

    document.getElementById("correct")
        .textContent = correct;

    document.getElementById("total")
        .textContent = total;

    correctAnswer = null;
}

document.getElementById("playBtn")
    .addEventListener(
        "click",
        newExercise
    );

document.querySelectorAll(".answer")
    .forEach(btn=>{

        btn.addEventListener(
            "click",
            ()=>{

                checkAnswer(
                    parseInt(
                        btn.dataset.answer
                    )
                );

            }
        );

    });

</script>

</body>
</html>
